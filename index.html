<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz de Estudos · ADS USCS</title>
  <meta name="description" content="Resumos e questões para as provas de ADS (USCS): Métodos Ágeis de Desenvolvimento e Padrões de Usabilidade e Desenvolvimento de Interfaces.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <div class="container">
      <button class="trocar" id="btn-trocar" type="button" hidden>← Trocar matéria</button>
      <p class="sobretitulo" id="sobretitulo">ADS · 4º semestre · USCS</p>
      <h1 id="titulo">Quiz de Estudos</h1>
      <p class="subtitulo" id="subtitulo">Escolha a matéria que você quer estudar.</p>
    </div>
  </header>

  <div class="topo-fixo" id="topo-fixo" hidden>
    <div class="container">
      <nav class="abas" role="tablist" aria-label="Seções do quiz">
        <button class="aba" role="tab" id="aba-resumo" aria-controls="painel-resumo" aria-selected="true" data-aba="resumo">Resumo</button>
        <button class="aba" role="tab" id="aba-objetivas" aria-controls="painel-objetivas" aria-selected="false" data-aba="objetivas" tabindex="-1">Objetivas</button>
        <button class="aba" role="tab" id="aba-dissertativas" aria-controls="painel-dissertativas" aria-selected="false" data-aba="dissertativas" tabindex="-1">Dissertativas</button>
      </nav>

      <div class="placar" id="placar" hidden>
        <div class="placar-info">
          <span id="placar-texto">0 / 0</span>
          <span class="placar-nota" id="placar-nota" hidden></span>
        </div>
        <div class="barra" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barra">
          <div class="barra-preenchida" id="barra-preenchida"></div>
        </div>
        <button class="botao botao-secundario" id="btn-refazer" type="button">Refazer</button>
      </div>
    </div>
  </div>

  <main class="container">
    <section class="painel" id="painel-inicio" aria-labelledby="titulo"></section>
    <section class="painel" id="painel-resumo" role="tabpanel" aria-labelledby="aba-resumo" hidden></section>
    <section class="painel" id="painel-objetivas" role="tabpanel" aria-labelledby="aba-objetivas" hidden></section>
    <section class="painel" id="painel-dissertativas" role="tabpanel" aria-labelledby="aba-dissertativas" hidden></section>
  </main>

  <button class="botao voltar" id="btn-voltar" type="button" hidden></button>

  <footer class="rodape container" id="rodape">
    Material de estudo das disciplinas de ADS, 4º semestre, USCS.
  </footer>

  <script src="data/materias.js"></script>
  <script src="data/ageis/resumo.js"></script>
  <script src="data/ageis/objetivas.js"></script>
  <script src="data/ageis/dissertativas.js"></script>
  <script src="data/usabilidade/resumo.js"></script>
  <script src="data/usabilidade/objetivas.js"></script>
  <script src="data/usabilidade/dissertativas.js"></script>
  <script src="app.js"></script>
</body>
</html>
